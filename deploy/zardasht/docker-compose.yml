name: toolshop

# Deployment for the zardasht host. The host already runs a shared PostgreSQL
# and Traefik on the external `database` and `proxy` networks.
#
# PostgreSQL and Redis are external dependencies, not services in this file.
# Redis must be reachable on the `database` network (or through REDIS_URL).
#
# Meilisearch is intentionally absent: the API falls back to database search when
# the engine is unreachable. Add it later only if the host has memory to spare.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    image: ${APP_API_IMAGE:?set APP_API_IMAGE in .env}
    container_name: toolshop-api
    init: true
    restart: unless-stopped
    cgroup_parent: workloads.slice
    mem_limit: 320m
    memswap_limit: 576m
    mem_reservation: 48m
    cpus: '0.35'
    cpu_shares: 256
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - /srv/data/toolshop/uploads:/app/uploads
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    expose: ['4000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks: [app_internal, database]
    logging: *logging

  web:
    image: ${APP_WEB_IMAGE:?set APP_WEB_IMAGE in .env}
    container_name: toolshop-web
    init: true
    restart: unless-stopped
    cgroup_parent: workloads.slice
    mem_limit: 320m
    memswap_limit: 576m
    mem_reservation: 48m
    cpus: '0.35'
    cpu_shares: 256
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
    volumes:
      - /srv/data/toolshop/next-cache:/app/apps/web/.next/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    expose: ['3000']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [app_internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.toolshop.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)
      - traefik.http.routers.toolshop.entrypoints=websecure
      - traefik.http.routers.toolshop.tls=true
      - traefik.http.routers.toolshop.tls.certresolver=letsencrypt
      - traefik.http.routers.toolshop.service=toolshop
      - traefik.http.services.toolshop.loadbalancer.server.port=3000
      - traefik.http.routers.toolshop.middlewares=security-headers@file,toolshop-compress
      - traefik.http.middlewares.toolshop-compress.compress=true
    logging: *logging

  # One-off jobs. Run them with:
  #   docker compose --profile tools run --rm migrate
  #   docker compose --profile tools run --rm seed
  migrate:
    image: ${APP_TOOLS_IMAGE:?set APP_TOOLS_IMAGE in .env}
    profiles: ['tools']
    restart: 'no'
    cgroup_parent: workloads.slice
    mem_limit: 256m
    memswap_limit: 384m
    mem_reservation: 32m
    cpus: '0.5'
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    networks: [database]
    command: ['pnpm', 'prisma', 'migrate', 'deploy']
    logging: *logging

  seed:
    image: ${APP_TOOLS_IMAGE:?set APP_TOOLS_IMAGE in .env}
    profiles: ['tools']
    restart: 'no'
    cgroup_parent: workloads.slice
    mem_limit: 256m
    memswap_limit: 384m
    mem_reservation: 32m
    cpus: '0.5'
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: .env
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    networks: [database]
    command: ['pnpm', 'prisma', 'db', 'seed']
    logging: *logging

networks:
  proxy:
    external: true
    name: proxy
  database:
    external: true
    name: database
  app_internal:
    internal: true
