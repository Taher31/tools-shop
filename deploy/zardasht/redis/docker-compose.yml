name: infrastructure-redis

# Shared Redis for apps on the zardasht host. This stack is separate from any
# application compose file; apps join the external `database` network and use
# redis://:<password>@redis:6379/<db>.

services:
  redis:
    image: redis:7.4-alpine
    container_name: redis
    user: '999:1000'
    init: true
    restart: unless-stopped
    cgroup_parent: workloads.slice
    mem_limit: 128m
    memswap_limit: 192m
    mem_reservation: 32m
    cpus: '0.20'
    cpu_shares: 256
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The password is expanded inside the container, so it does not appear in
    # `docker inspect` as a command-line argument.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        umask 077
        {
          echo 'bind 0.0.0.0'
          echo 'protected-mode yes'
          echo 'port 6379'
          echo 'dir /data'
          echo 'appendonly yes'
          echo 'save ""'
          echo 'maxmemory 96mb'
          echo 'maxmemory-policy noeviction'
          printf 'requirepass %s\n' "$$REDIS_PASSWORD"
        } > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - /srv/data/redis:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    expose: ['6379']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [database]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  database:
    external: true
    name: database
